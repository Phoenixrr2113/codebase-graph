<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CodeGraph Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #0d1117; color: #e6edf3; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    #graph { width: 100%; height: 480px; background: #161b22; border-radius: 8px; display: block; }
    #status { font-size: 12px; color: #8b949e; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>CodeGraph Explorer</h1>
  <canvas id="graph"></canvas>
  <div id="status">Loading&#8230;</div>
  <script>
    var status = document.getElementById('status');
    if (typeof window !== 'undefined' && window.mcp) {
      window.mcp.callTool('fetch_graph_data', {}).then(function(data) {
        var nodes = (data && data.nodes) ? data.nodes.length : 0;
        var edges = (data && data.edges) ? data.edges.length : 0;
        status.textContent = 'Loaded ' + nodes + ' nodes, ' + edges + ' edges.';
      }).catch(function(err) {
        status.textContent = 'mcp.callTool failed: ' + String(err);
      });
    } else {
      status.textContent = 'MCP App UI host not detected. This panel requires Claude Desktop or another App-UI-capable client.';
    }
  </script>
</body>
</html>
